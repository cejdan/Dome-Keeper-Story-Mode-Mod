storymode:
  type: gamemode

# The win condition's own shop section (#144), at the top like Prestige's: a
# second root that Storymode.gd adds to every Story Mode run, holding only
# Retire Rich. mod_main.gd puts it first in the shop's track order.
storyWin:
  type: gamemode

storySuitblaster:
  cost: money=200
  shadowing: suitblaster
  shadowing-desc: storysuitblaster
  predecessors: [storymode]

# New Gadget I-IV (#132): each opens vanilla's gadget choice; paid on pick
# (gamemode/gadget_shop.gd). Prices are starting values for the user to tune.
storyNewGadget1:
  cost: money=50
  predecessors: [storymode]

storyNewGadget2:
  cost: money=400
  predecessors: [storyNewGadget1]

storyNewGadget3:
  cost: money=2500
  predecessors: [storyNewGadget2]

storyNewGadget4:
  cost: money=10000
  predecessors: [storyNewGadget3]

storyRetireRich:
  cost: money=1000000
  predecessors: [storyWin]

storyHeatShield1:
  cost: money=0
  predecessors: [storymode]
  propertyChanges:
    - suit.heatshield = 1

storyHeatShield2:
  cost: money=0
  predecessors: [storyHeatShield1]
  propertyChanges:
    - suit.heatshield = 2

storyHeatShield3:
  cost: money=0
  predecessors: [storyHeatShield2]
  propertyChanges:
    - suit.heatshield = 3

storyHeatShield4:
  cost: money=0
  predecessors: [storyHeatShield3]
  propertyChanges:
    - suit.heatshield = 4

