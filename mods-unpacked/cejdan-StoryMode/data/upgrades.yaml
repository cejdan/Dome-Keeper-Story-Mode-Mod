storymode:
  type: gamemode
  unlockslimits: [storyonly]

storySuitblaster:
  cost: money=200
  shadowing: suitblaster
  shadowing-desc: storysuitblaster
  predecessors: [storymode]

# New Gadget I-IV (#132): each opens vanilla's gadget choice; paid on pick
# (gamemode/gadget_shop.gd). Prices are starting values for the user to tune.
storyNewGadget1:
  cost: money=50
  predecessors: [storymode]

storyNewGadget2:
  cost: money=400
  predecessors: [storyNewGadget1]

storyNewGadget3:
  cost: money=2500
  predecessors: [storyNewGadget2]

storyNewGadget4:
  cost: money=10000
  predecessors: [storyNewGadget3]

storyRetireRich:
  cost: money=1000000
  predecessors: [storymode]

storyHeatShield1:
  cost: money=0
  predecessors: [storymode]
  propertyChanges:
    - suit.heatshield = 1

storyHeatShield2:
  cost: money=0
  predecessors: [storyHeatShield1]
  propertyChanges:
    - suit.heatshield = 2

storyHeatShield3:
  cost: money=0
  predecessors: [storyHeatShield2]
  propertyChanges:
    - suit.heatshield = 3

storyHeatShield4:
  cost: money=0
  predecessors: [storyHeatShield3]
  propertyChanges:
    - suit.heatshield = 4

# Metal Bit (#147): the Mine Driller's and Drillbert's drills cut metal
# (extensions/.../TileToucher.gd and Drillbot.gd, extensions/.../Tile.gd).
# Story Mode only: the storymode root unlocks the storyonly limit. Prices are
# starting values for the user to tune.
storyDrillMetal:
  limit: [storyonly]
  cost: money=600
  predecessors: [drill]

storyDrillbotMetal:
  limit: [storyonly]
  cost: money=600
  predecessors: [drillbot]

