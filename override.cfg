; Dev-only project overrides, read by Godot at startup (no vanilla files edited).
; Keeps the modding project's saves, logs and settings out of the real game's
; user folder (%APPDATA%\Godot\app_userdata\Dome Keeper), which Steam Cloud syncs.
; Dev data goes to %APPDATA%\StoryModeDev instead.

[application]

config/use_custom_user_dir=true
config/custom_user_dir_name="StoryModeDev"

; Turns off the Sentry SDK (crash reports, sessions, crashpad) for dev runs, so
; modded builds never report to the game developers. The SDK checks this before
; it waits for addons/sentry/sentry_configuration.gd. The shipped game is unchanged.

[sentry]

options/enabled=false
